<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram • A little introduction</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#100d16;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#32203f,transparent 65%),#100d16}main{width:min(760px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:11px;letter-spacing:2px;color:#d6c5df}header span:last-child{color:#a793b2;letter-spacing:1px}.stage{border-radius:24px;overflow:hidden;box-shadow:0 25px 100px #0008;border:1px solid #ffffff18;background:#130b21}canvas{width:100%;height:auto;display:block;aspect-ratio:1}nav{display:flex;align-items:center;gap:15px;margin-top:20px}button{border:1px solid #ffffff28;border-radius:100px;background:#ffffff0c;color:#fff;padding:11px 18px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}button:hover{background:#ffffff20}button:focus-visible,input:focus-visible{outline:2px solid #fbad54;outline-offset:4px}input{flex:1;min-width:30px;accent-color:#ed49a7;cursor:pointer}output{font-size:11px;font-variant-numeric:tabular-nums;color:#c7b5d2;min-width:71px}footer{margin-top:17px;color:#9d8da8;font-size:11px;line-height:1.6;display:flex;justify-content:space-between;gap:15px}@media(max-width:500px){body{padding:14px}.stage{border-radius:18px}nav{gap:8px}button{padding:10px 12px}footer{display:block}footer span{display:block}}@media(prefers-reduced-motion:reduce){canvas{scroll-behavior:auto}}
</style></head><body><main>
<header><span>A LITTLE INTRODUCTION</span><span>10 SECONDS / 30 FPS</span></header>
<div class="stage"><canvas id="film" width="1080" height="1080" role="img" aria-label="Animated introduction to Instagram: share photos, tell Stories, watch Reels, and connect with friends."></canvas></div>
<nav aria-label="Animation playback"><button id="play" aria-label="Pause animation">Pause</button><button id="replay">Replay</button><input id="seek" aria-label="Animation frame" type="range" min="0" max="299" value="0"><output id="time">0.0 / 10.0s</output></nav>
<footer><span>Unofficial concept animation · Made for this introduction.</span><span>Space to pause · Arrow keys to step frames</span></footer>
</main><script>
'use strict';
const canvas=document.getElementById('film'),c=canvas.getContext('2d'),play=document.getElementById('play'),seek=document.getElementById('seek'),time=document.getElementById('time');
const W=1080,FPS=30,N=300,TAU=Math.PI*2;
let frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,start=performance.now();
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>1-Math.pow(1-clamp(v),3);
function rr(x,y,w,h,r=24){c.beginPath();c.roundRect(x,y,w,h,r)}
function box(x,y,w,h,r,fill,stroke){rr(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function text(s,x,y,size=48,color='#fff',weight=700,align='center'){c.fillStyle=color;c.font=`${weight} ${size}px Arial, Helvetica, sans-serif`;c.textAlign=align;c.fillText(s,x,y)}
function gradient(x=0,y=0,w=1080,h=1080){let g=c.createLinearGradient(x,y+h,x+w,y);g.addColorStop(0,'#ffca65');g.addColorStop(.3,'#ff604e');g.addColorStop(.58,'#df2e95');g.addColorStop(1,'#7955ec');return g}
function circle(x,y,r,fill){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=fill;c.fill()}
function line(x,y,x2,y2,color='#fff',width=6){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.stroke()}
function logo(x,y,s){c.save();c.translate(x,y);box(-s/2,-s/2,s,s,s*.26,gradient(-s/2,-s/2,s,s));c.strokeStyle='white';c.lineWidth=s*.065;rr(-s*.3,-s*.3,s*.6,s*.6,s*.18);c.stroke();c.beginPath();c.arc(0,0,s*.145,0,TAU);c.stroke();circle(s*.19,-s*.19,s*.044,'#fff');c.restore()}
function heart(x,y,s,color='#fff'){c.save();c.translate(x,y);c.scale(s/100,s/100);c.beginPath();c.moveTo(0,33);c.bezierCurveTo(-85,-19,-34,-70,0,-31);c.bezierCurveTo(34,-70,85,-19,0,33);c.fillStyle=color;c.fill();c.restore()}
function landscape(x,y,w,h,variant=0){c.save();rr(x,y,w,h,20);c.clip();let g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,variant?'#be8ee9':'#ffbca9');g.addColorStop(1,variant?'#554fbc':'#f9d78c');c.fillStyle=g;c.fillRect(x,y,w,h);circle(x+w*.73,y+h*.28,w*.11,'#fff0bd');c.beginPath();c.moveTo(x,y+h*.78);c.lineTo(x+w*.34,y+h*.4);c.lineTo(x+w*.7,y+h);c.lineTo(x,y+h);c.fillStyle=variant?'#4b3b8e':'#b75980';c.fill();c.beginPath();c.moveTo(x+w*.22,y+h);c.lineTo(x+w*.72,y+h*.52);c.lineTo(x+w,y+h*.78);c.lineTo(x+w,y+h);c.fillStyle=variant?'#292a68':'#623f6b';c.fill();c.restore()}
function label(num,word){text(num+' / 05',84,88,17,'#f2c6e7',600,'left');text(word,996,88,17,'#f2c6e7',600,'right')}
function caption(title,sub,p){let dy=30*(1-ease(p/.35));c.save();c.globalAlpha=ease(p/.3);text(title,540,862+dy,66);text(sub,540,917+dy,25,'#e1cfe9',400);c.restore()}
function scene(i,p,t){label(String(i+1).padStart(2,'0'),['HELLO, INSTAGRAM','PHOTOS','STORIES','REELS','CONNECTION'][i]);
if(i===0){let k=ease(p/.55);c.save();c.translate(540,385);c.scale(.7+.3*k,.7+.3*k);c.rotate((1-k)*-.22);logo(0,0,245);c.restore();text('Instagram',540,637,96);text('A place for your everyday magic.',540,704,30,'#e7d1ee',400);for(let j=0;j<9;j++){let a=j*TAU/9+t*.18,r=320+Math.sin(t*2+j)*15;circle(540+Math.cos(a)*r,400+Math.sin(a)*r,3+j%3,'#ffb3cf88')}text('CREATE. SHARE. CONNECT.',540,926,19,'#f5b3dc',600)}
if(i===1){for(let j=0;j<3;j++){c.save();c.translate(540+(j-1)*225,435+Math.abs(j-1)*35+Math.sin(t*2+j)*9);c.rotate((j-1)*.14);let s=.87+(j===1?.13:0);c.scale(s,s);box(-175,-230,350,470,28,'#fff');circle(-137,-194,13,'#cf63ac');box(-111,-200,106,9,4,'#d5c6d5');landscape(-155,-166,310,317,j%2);heart(-133,190,26,'#ec4d88');line(-101,184,-48,184,'#e5dce6',6);line(-101,200,-15,200,'#e5dce6',6);c.restore()}caption('Make a moment last.','Share the photos that feel like you.',p)}
if(i===2){for(let j=0;j<3;j++){let x=300+j*240;c.strokeStyle=gradient(x-85,180,170,170);c.lineWidth=8;c.beginPath();c.arc(x,232,69,-Math.PI/2,-Math.PI/2+TAU*ease((p+j*.1)/.55));c.stroke();circle(x,232,56,['#dc91b9','#af94d6','#eea782'][j]);text(['YOU','FRIENDS','TODAY'][j],x,240,15,'#4d2d5f',700)}c.save();c.translate(540,527+Math.sin(t*2)*7);c.rotate(-.035);box(-138,-201,276,402,27,'#fff');landscape(-124,-187,248,374);for(let j=0;j<3;j++)box(-106+j*73,-170,65,4,2,'#ffffff99');box(-108,-170,65*clamp(p),4,2,'#fff');box(-108,56,214,70,14,'#ffffffeb');text('little moments',0,100,24,'#813f78');c.restore();caption('Your day, in Stories.','Let friends in on the little things.',p)}
if(i===3){c.save();c.translate(540,440);c.rotate(Math.sin(t*2)*.035);box(-162,-245,324,510,36,'#fff');rr(-149,-231,298,481,26);c.save();c.clip();c.fillStyle=gradient(391,195,324,510);c.fillRect(-149,-231,298,481);for(let j=0;j<5;j++){c.save();c.translate(Math.sin(t*2+j)*90,(j-2)*110+Math.cos(t*2+j)*20);c.rotate(t*.5+j);box(-100,-35,200,70,35,['#ffce83','#ee82b9','#7854d7'][j%3]);c.restore()}c.restore();circle(0,-10,59,'#ffffff35');c.beginPath();c.moveTo(-14,-39);c.lineTo(30,-10);c.lineTo(-14,19);c.closePath();c.fillStyle='#fff';c.fill();heart(111,106,25);circle(111,155,11,'#fff');text('Find your next favorite.',-120,199,17,'#fff',700,'left');c.restore();for(let j=0;j<9;j++){let h=22+Math.abs(Math.sin(t*5+j*.6))*95;box(246+j*68,735-h/2,18,h,9,j%2?'#fe8ebd':'#b591ef')}caption('A little inspiration.','Discover creativity, one Reel at a time.',p)}
if(i===4){let k=ease(p/.55);for(let j=0;j<6;j++){let a=j*TAU/6-.3,r=230*k,x=540+Math.cos(a)*r,y=411+Math.sin(a)*r;line(540,411,x,y,'#f799cf33',3);circle(x,y,37+Math.sin(t*3+j)*3,['#e8a1ba','#f0b27d','#b599e0'][j%3]);circle(x,y-8,10,'#ffffffaa');c.beginPath();c.ellipse(x,y+16,18,12,0,Math.PI,0);c.fillStyle='#ffffffaa';c.fill()}logo(540,411,160);heart(710,200+Math.sin(t*3)*7,40,'#ff8bc1');heart(325,610+Math.cos(t*3)*7,28,'#cbb0ff');caption('Find your people.','Share what you love. Connect through it.',p);text('Instagram',540,739,41,'#fff',700)}
}
function render(f){let t=f/FPS,i=Math.min(4,Math.floor(t/2)),p=(t-i*2)/2;c.clearRect(0,0,W,W);let bg=c.createLinearGradient(0,0,1080,1080);bg.addColorStop(0,'#251039');bg.addColorStop(.5,'#1c102c');bg.addColorStop(1,'#3b1438');c.fillStyle=bg;c.fillRect(0,0,W,W);let glow=c.createRadialGradient(930,170,0,930,170,650);glow.addColorStop(0,'#cc40892d');glow.addColorStop(1,'#cc408900');c.fillStyle=glow;c.fillRect(0,0,W,W);c.save();let enter=ease(p/.16),leave=i===4?1:ease((1-p)/.12);c.globalAlpha=Math.min(enter,leave);c.translate(0,(1-enter)*25);scene(i,p,t);c.restore();for(let j=0;j<5;j++){box(84+j*185,1001,169,4,2,'#ffffff20');if(j<i)box(84+j*185,1001,169,4,2,'#ed94cc');if(j===i)box(84+j*185,1001,169*(i===4&&f===299?1:p),4,2,'#ed94cc')}seek.value=f;time.textContent=(f/FPS).toFixed(1)+' / 10.0s'}
function updateButton(){play.textContent=playing?'Pause':frame===299?'Play again':'Play';play.setAttribute('aria-label',playing?'Pause animation':'Play animation')}
function toggle(){if(!playing&&frame===299)frame=0;playing=!playing;start=performance.now()-frame*1000/FPS;updateButton()}
play.onclick=toggle;document.getElementById('replay').onclick=()=>{frame=0;start=performance.now();playing=true;updateButton();render(frame)};
seek.oninput=()=>{frame=Number(seek.value);start=performance.now()-frame*1000/FPS;render(frame)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();playing=false;frame=clamp(frame+(e.code==='ArrowRight'?1:-1),0,299);render(frame);updateButton()}});
function tick(now){if(playing){let next=Math.min(299,Math.floor((now-start)*FPS/1000));if(next!==frame){frame=next;render(frame)}if(now-start>=10000){playing=false;updateButton()}}requestAnimationFrame(tick)}
render(0);updateButton();requestAnimationFrame(tick);
</script></body></html>
