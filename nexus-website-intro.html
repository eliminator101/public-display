let frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,start=performance.now();
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>1-Math.pow(1-clamp(v),3);
function rr(x,y,w,h,r=24){c.beginPath();c.roundRect(x,y,w,h,r)}
function box(x,y,w,h,r,fill,stroke){rr(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function text(s,x,y,size=48,color='#4a453d',weight=700,align='center'){c.fillStyle=color;c.font=`${weight} ${size}px Arial, Helvetica, sans-serif`;c.textAlign=align;c.fillText(s,x,y)}
function gradient(x=0,y=0,w=1080,h=1080){let g=c.createLinearGradient(x,y+h,x+w,y);g.addColorStop(0,'#e5f6a2');g.addColorStop(.3,'#bce776');g.addColorStop(.58,'#60b99b');g.addColorStop(1,'#2c897e');return g}
function circle(x,y,r,fill){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=fill;c.fill()}
function line(x,y,x2,y2,color='#4a453d',width=6){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.stroke()}
function wordmark(x,y,w){if(brand.complete&&brand.naturalWidth)c.drawImage(brand,x-w/2,y-w*.13,w,w*.26);else text('NEXUS',x,y+20,w*.17,'#5f5a53',500)}
function logo(x,y,s){wordmark(x,y,s*3.2)}
function heart(x,y,s,color='#4a453d'){c.save();c.translate(x,y);c.scale(s/100,s/100);c.beginPath();c.moveTo(0,33);c.bezierCurveTo(-85,-19,-34,-70,0,-31);c.bezierCurveTo(34,-70,85,-19,0,33);c.fillStyle=color;c.fill();c.restore()}
function landscape(x,y,w,h,variant=0){c.save();rr(x,y,w,h,20);c.clip();let g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,variant?'#be8ee9':'#ffbca9');g.addColorStop(1,variant?'#554fbc':'#f9d78c');c.fillStyle=g;c.fillRect(x,y,w,h);circle(x+w*.73,y+h*.28,w*.11,'#fff0bd');c.beginPath();c.moveTo(x,y+h*.78);c.lineTo(x+w*.34,y+h*.4);c.lineTo(x+w*.7,y+h);c.lineTo(x,y+h);c.fillStyle=variant?'#4b3b8e':'#b75980';c.fill();c.beginPath();c.moveTo(x+w*.22,y+h);c.lineTo(x+w*.72,y+h*.52);c.lineTo(x+w,y+h*.78);c.lineTo(x+w,y+h);c.fillStyle=variant?'#292a68':'#623f6b';c.fill();c.restore()}
function label(num,word){text(num+' / 05',84,88,17,'#b7c9a9',600,'left');text(word,996,88,17,'#b7c9a9',600,'right')}
function caption(title,sub,p){let dy=30*(1-ease(p/.35));c.save();c.globalAlpha=ease(p/.3);text(title,540,862+dy,64,'#4a453d',500);text(sub,540,917+dy,25,'#6b665f',400);c.restore()}
function notebook(x,y,w,h){box(x,y,w,h,22,'#f3f0d9');for(let j=0;j<7;j++)line(x+35,y+65+j*37,x+w-30,y+65+j*37,'#d3dcc3',2);for(let j=0;j<5;j++)box(x-7,y+27+j*56,17,6,3,'#86b69b')}
function check(x,y,p){line(x,y,x+12*p,y+12*p,'#245f45',5);if(p>.4)line(x+12,y+12,x+12+24*(p-.4)/.6,y+12-28*(p-.4)/.6,'#245f45',5)}
function heading(a,b,p){let k=ease(p/.35);c.save();c.globalAlpha=k;text(a,540,650+(1-k)*25,76,'#4a453d',500);text(b,540,736+(1-k)*25,76,'#4f64ad',500);c.restore()}
function sheet(x,y,w,h,title,tag){box(x,y,w,h,20,'#fbf8f2','#ded7cc');box(x+24,y+25,75,27,9,'#e1ebf9');text(tag,x+61,y+44,12,'#4f64ad',600);text(title,x+24,y+97,25,'#4a453d',500,'left');for(let j=0;j<5;j++)box(x+24,y+126+j*26,w-48-(j%2)*40,5,2,'#dcd6cb')}
function scene(i,p,t){text('NEXUS',84,88,17,'#6b665f',600,'left');text(['MEET NEXUS','NOTE BANK','FIND YOUR SUBJECT','MOCK PAPERS','SHARE KNOWLEDGE'][i],996,88,17,'#6b665f',500,'right');

function render(f){let t=f/FPS,i=Math.min(4,Math.floor(t/2)),p=(t-i*2)/2;c.clearRect(0,0,W,W);c.fillStyle='#f6f3ed';c.fillRect(0,0,W,W);let glow=c.createRadialGradient(930,100,0,930,100,700);glow.addColorStop(0,'#e1ebf9');glow.addColorStop(1,'#f6f3ed00');c.fillStyle=glow;c.fillRect(0,0,W,W);c.save();let enter=ease(p/.16),leave=i===4?1:ease((1-p)/.12);c.globalAlpha=Math.min(enter,leave);c.translate(0,(1-enter)*25);scene(i,p,t);c.restore();for(let j=0;j<5;j++){box(84+j*185,1001,169,4,2,'#ded7cc');if(j<i)box(84+j*185,1001,169,4,2,'#4f64ad');if(j===i)box(84+j*185,1001,169*(i===4&&f===299?1:p),4,2,'#4f64ad')}seek.value=f;time.textContent=(f/FPS).toFixed(1)+' / 10.0s'}
function updateButton(){play.textContent=playing?'Pause':frame===299?'Play again':'Play';play.setAttribute('aria-label',playing?'Pause animation':'Play animation')}
function toggle(){if(!playing&&frame===299)frame=0;playing=!playing;start=performance.now()-frame*1000/FPS;updateButton()}
play.onclick=toggle;document.getElementById('replay').onclick=()=>{frame=0;start=performance.now();playing=true;updateButton();render(frame)};
seek.oninput=()=>{frame=Number(seek.value);start=performance.now()-frame*1000/FPS;render(frame)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();playing=false;frame=clamp(frame+(e.code==='ArrowRight'?1:-1),0,299);render(frame);updateButton()}});
function tick(now){if(playing){let next=Math.min(299,Math.floor((now-start)*FPS/1000));if(next!==frame){frame=next;render(frame)}if(now-start>=10000){playing=false;updateButton()}}requestAnimationFrame(tick)}
brand.onload=()=>render(frame);render(0);updateButton();requestAnimationFrame(tick);
